<!DOCTYPE html>
<html>

<head>
    <title>AI Mindmap</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fc;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef4ff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI Mindmap Generator</h1>

        <textarea id="lesson"
            placeholder="Dán nội dung bài học vào đây..."></textarea>

        <br><br>

        <button onclick="createMindmap()">
            Tạo sơ đồ
        </button>

        <div id="result"></div>

    </div>

    <script>
        function createMindmap() {

            let text =
                document.getElementById("lesson").value;

            let items =
                text.split("\n");

            let html = "<h3>Sơ đồ tư duy</h3>";

            html += `
            <div style="
                background:#2563eb;
                color:white;
                padding:12px;
                border-radius:10px;
                display:inline-block;
                font-weight:bold;
                margin-bottom:20px;">
                📚 Bài học
            </div>
            `;

            items.forEach(item => {

                html += `
                <div style="
                    margin-left:50px;
                    margin-top:12px;
                    padding:10px;
                    background:white;
                    border-left:4px solid #2563eb;
                    border-radius:8px;">
                    ${item}
                </div>
                `;

            });

            document.getElementById("result").innerHTML = html;
        }
    </script>

</body>

</html>
